<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habilitación de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Habilitar empleado</h1>
            </div>
            <div class="card-body">
                <div class="col-6">
                    <a th:href="@{/empleado/listar}" class="btn btn-dark">Regresar</a>
                </div>
                <div class="mb-3"></div>
                <!-- Inicio de la tabla -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="table-dark">
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">A. Paterno</th>
                            <th scope="col">A. Materno</th>
                            <th scope="col">DNI</th>
                            <th scope="col">Fec. Nacimiento</th>
                            <th scope="col">Dirección</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Celular</th>
                            <th scope="col">Correo</th>
                            <th scope="col">Sexo</th>
                            <th scope="col">Usuario</th>
                            <th scope="col">Clave</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Distrito</th>
                            <th scope="col">Rol</th>
                            <th scope="col">Habilitar</th>
                            <th scope="col">Deshabilitar</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="emp : ${listaempleado}">
                            <th scope="row" th:text="${emp.codigo}"></th>
                            <td th:text="${emp.nombre}"></td>
                            <td th:text="${emp.apellidoPaterno}"></td>
                            <td th:text="${emp.apellidoMaterno}"></td>
                            <td th:text="${emp.dni}"></td>
                            <td th:text="${emp.fecha}"></td>
                            <td th:text="${emp.direccion}"></td>
                            <td th:text="${emp.telefono}"></td>
                            <td th:text="${emp.celular}"></td>
                            <td th:text="${emp.correo}"></td>
                            <td th:text="${emp.sexo}"></td>
                            <td th:text="${emp.usuario}"></td>
                            <td th:text="${emp.clave}"></td>
                            <td th:text="${emp.estado ? 'Habilitado' : 'Deshabilitado'}"></td>
                            <td th:text="${emp.distrito.nombre}"></td>
                            <td th:text="${emp.rol.nombre}"></td>
                            <td><a href="#" class="btn btn-warning">Seleccionar</a></td>
                            <td><a href="#" class="btn btn-danger">Seleccionar</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Fin de la tabla -->
            </div>
        </div>
    </div>
</body>
</html>
