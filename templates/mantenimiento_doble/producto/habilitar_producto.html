<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habilitación de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Habilitar producto</h1>
            </div>
            <div class="card-body">
                <div class="col-6">
                    <a th:href="@{/producto/listar}" class="btn btn-dark">Regresar</a>
                </div>
                <div class="mb-3"></div>
                <!-- Inicio de la tabla -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Descripción</th>
                                <th scope="col">Fecha de Ingreso</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Marca</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Habilitar</th>
                                <th scope="col">Deshabilitar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pro : ${listaproducto}">
                                <th scope="row" th:text="${pro.codigo}"></th>
                                <td th:text="${pro.nombre}"></td>
                                <td th:text="${pro.descripcion}"></td>
                                <td th:text="${pro.fechaIngreso}"></td>
                                <td th:text="${pro.precio}"></td>
                                <td th:text="${pro.cantidad}"></td>
                                <td th:text="${pro.marca.nombre}"></td>
                                <td th:text="${pro.categoria.nombre}"></td>
                                <td th:text="${pro.estado} ? 'Habilitado' : 'Deshabilitado'"></td>
                                <td><a href="#" class="btn btn-warning">Seleccionar</a></td>
                                <td><a href="#" class="btn btn-danger">Seleccionar</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Fin de la tabla -->
            </div>
        </div>
    </div>
</body>
</html>
