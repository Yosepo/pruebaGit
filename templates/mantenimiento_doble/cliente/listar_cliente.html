<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Listar cliente</h1>
            </div>
            <div class="card-body">
                <div class="col-6">
                    <a href="registrar_cliente.html" class="btn btn-primary">Registrar cliente</a>
                    <a th:href="@{/cliente/habilitar}" class="btn btn-warning">Habilitar cliente</a>
                    <a th:href="@{/menu}" class="btn btn-dark">Regresar</a>
                </div>
                <div class="mb-3"></div>
                <!-- Inicio de la tabla -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">A. Paterno</th>
                                <th scope="col">A. Materno</th>
                                <th scope="col">Num. Documento</th>
                                <th scope="col">Fec. Nacimiento</th>
                                <th scope="col">Dirección</th>
                                <th scope="col">Teléfono</th>
                                <th scope="col">Celular</th>
                                <th scope="col">Correo</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Distrito</th>
                                <th scope="col">Sexo</th>
                                <th scope="col">T. Documento</th>
                                <th scope="col">Actualizar</th>
                                <th scope="col">Eliminar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cli : ${listacliente}">
                                <th scope="row" th:text="${cli.codigo}"></th>
                                <td th:text="${cli.nombre}"></td>
                                <td th:text="${cli.apellidoPaterno}"></td>
                                <td th:text="${cli.apellidoMaterno}"></td>
                                <td th:text="${cli.documento}"></td>
                                <td th:text="${cli.fecha}"></td>
                                <td th:text="${cli.direccion}"></td>
                                <td th:text="${cli.telefono}"></td>
                                <td th:text="${cli.celular}"></td>
                                <td th:text="${cli.correo}"></td>
                                <td th:text="${cli.estado ? 'Habilitado' : 'Deshabilitado'}"></td>
                                <td th:text="${cli.distrito.nombre}"></td>
                                <td th:text="${cli.sexo.nombre}"></td>
                                <td th:text="${cli.tipoDocumento.nombre}"></td>
                                <td><a href="actualizar_cliente.html" class="btn btn-success">Seleccionar</a></td>
                                <td><a href="#" class="btn btn-danger">Seleccionar</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Fin de la tabla -->
            </div>
        </div>
    </div>
</body>
</html>
