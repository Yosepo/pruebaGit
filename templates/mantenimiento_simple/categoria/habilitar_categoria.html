<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habilitación de Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Habilitar categoría</h1>
            </div>
            <div class="card-body">
                <div class="col-6">
                    <a th:href="@{/categoria/listar}" class="btn btn-dark">Regresar</a>
                </div>
                <div class="mb-3"></div>
                <!-- Inicio de la tabla -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Habilitar</th>
                                <th scope="col">Deshabilitar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${listacategoria}">
                                <th scope="row" th:text="${cat.codigo}"></th>
                                <td th:text="${cat.nombre}"></td>
                                <td th:text="${cat.estado} ? 'Habilitado' : 'Deshabilitado'"></td>
                                <td>
                                    <form method="post" th:action="@{/categoria/habilitar/{id}(id=${cat.codigo})}">
                                        <button type="submit" class="btn btn-warning">Seleccionar</button>
                                    </form>
                                </td>
                                <td>
                                    <form method="post" th:action="@{/categoria/deshabilitar/{id}(id=${cat.codigo})}">
                                        <button type="submit" class="btn btn-danger">Seleccionar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Fin de la tabla -->
            </div>
        </div>
    </div>
</body>
</html>
