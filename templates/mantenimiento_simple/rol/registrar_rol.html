<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Registrar rol</h1>
            </div>
            <div class="card-body">
                <!-- Inicio del formulario -->
                <form th:action="@{/rol/registrar}" th:object="${rol}" class="needs-validation" novalidate method="post">
                    <div class="col-4">
                        <label for="txtNom" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="txtNom" th:field="*{nombre}" required />
                        <div class="invalid-feedback">Se requiere un nombre</div>
                    </div>
                    <div class="col-4">
                        <label for="chkEst" class="form-label">Estado:</label>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="chkEst" th:field="*{estado}" />
                            <label class="form-check-label" for="chkEst">Habilitado</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Registrar</button>
                        <a th:href="@{/rol/listar}" class="btn btn-dark">Regresar</a>
                    </div>
                </form>
                <!-- Fin del formulario -->
            </div>
        </div>
    </div>
    <script>
        (() => {
            'use strict'
    
            const forms = document.querySelectorAll('.needs-validation')
    
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
    
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
