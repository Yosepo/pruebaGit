<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Distritos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Listar distrito</h1>
            </div>
            <div class="card-body">
                <div class="col-6">
                    <a th:href="@{/distrito/registrar}" class="btn btn-primary">Registrar distrito</a>
                    <a th:href="@{/distrito/habilitar}" class="btn btn-warning">Habilitar distrito</a>
                    <a th:href="@{/menu}" class="btn btn-dark">Regresar</a>
                </div>
                <div class="mb-3"></div>
                <!-- Inicio de la tabla -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Actualizar</th>
                                <th scope="col">Eliminar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dis : ${listadistrito}">
                                <th scope="row" th:text="${dis.codigo}"></th>
                                <td th:text="${dis.nombre}"></td>
                                <td th:text="${dis.estado ? 'Habilitado' : 'Deshabilitado'}"></td>
                                <td><a th:href="@{/distrito/actualizar(id=${dis.codigo})}" class="btn btn-success">Seleccionar</a></td>
                                <td>
                                    <form method="post" th:action="@{/distrito/eliminar/{id}(id=${dis.codigo})}">
                                        <button type="submit" class="btn btn-danger">Seleccionar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Fin de la tabla -->
            </div>
        </div>
    </div>
</body>
</html>
