<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <!-- Inicio de la tarjeta -->
        <div class="card w-50" style="margin: auto;">
            <div class="card-header text-center">
                <h1>Ingreso al sistema</h1>
            </div>
            <div class="card-body">
                <!-- Inicio del formulario -->
                <form>
                    <div class="col-6">
                        <label for="txtUsuario" class="form-label">Usuario:</label>
                        <input type="text" class="form-control" id="txtUsuario" placeholder="Ingrese su usuario">
                    </div>
                    <div class="col-6">
                        <label for="txtClave" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="txtClave" placeholder="Ingrese su contraseña">
                    </div>
                    <div class="mb-3"></div>
                    <div class="col-6">
                        <button type="submit" class="btn btn-primary" id="btnIngresar">Ingresar</button>
                        <a th:href="@{/menu}">Ir al menu principal</a>
                    </div>
                </form>
                <!-- Fin del formulario -->
            </div>
        </div>
        <!-- Fin de la tarjeta -->
    </div>
</body>
</html>
